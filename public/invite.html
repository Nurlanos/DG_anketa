<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Приглашение — D8N AI</title>
<style>body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:#f3f6fb;color:#0d1f4e;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,sans-serif}.box{width:min(100%,390px);padding:32px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 16px 45px rgba(13,31,78,.08)}h1{margin:0 0 6px;font-size:22px}p{margin:0 0 24px;color:#6b7280}label{display:block;margin:14px 0 6px;color:#4b5563;font-size:12px;font-weight:600}input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #e5e7eb;border-radius:6px;font:inherit}.wrap{position:relative}.wrap input{padding-right:48px}.toggle{position:absolute;right:8px;top:50%;width:32px;margin:0;padding:4px;transform:translateY(-50%);border:0;background:transparent;color:#2056b8;cursor:pointer}button[type=submit]{width:100%;margin-top:22px;padding:12px;border:0;border-radius:6px;background:#f5c518;color:#0d1f4e;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#error{min-height:20px;margin-top:14px;color:#b91c1c;font-size:12px}</style></head>
<body><main class="box"><h1>Добро пожаловать</h1><p>Создайте пароль для доступа к дашборду.</p><form id="invite-form"><label for="password">Новый пароль</label><div class="wrap"><input id="password" type="password" minlength="8" pattern="[!-~]+" required autofocus oninput="this.value=this.value.replace(/[^\x21-\x7E]/g,'')"><button class="toggle" type="button" onclick="togglePassword('password',this)">◉</button></div><label for="confirm">Повторите пароль</label><div class="wrap"><input id="confirm" type="password" minlength="8" pattern="[!-~]+" required oninput="this.value=this.value.replace(/[^\x21-\x7E]/g,'')"><button class="toggle" type="button" onclick="togglePassword('confirm',this)">◉</button></div><button type="submit">Создать пароль и войти</button><div id="error" role="alert"></div></form></main>
<script>const token=new URLSearchParams(location.search).get('token')||'';function togglePassword(id,button){const input=document.getElementById(id);input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'◉':'○'}document.getElementById('invite-form').addEventListener('submit',async(event)=>{event.preventDefault();const form=event.currentTarget,error=document.getElementById('error'),button=form.querySelector('button[type=submit]');if(form.password.value!==form.confirm.value){error.textContent='Пароли не совпадают';return}button.disabled=true;try{const response=await fetch('/api/accept-invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:form.password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Ссылка недействительна');location.href='/dashboard'}catch(err){error.textContent=err.message;button.disabled=false}})</script></body></html>
