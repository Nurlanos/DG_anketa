<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Смена пароля — D8N AI</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --navy: #0d1f4e;
        --blue: #2056b8;
        --yellow: #f5c518;
        --bg: #f3f6fb;
        --border: #e5e7eb;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: var(--bg);
        color: var(--navy);
        font:
          14px/1.5 Inter,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      .box {
        width: min(100%, 390px);
        padding: 32px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 16px 45px rgba(13, 31, 78, 0.08);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: #6b7280;
      }
      label {
        display: block;
        margin: 14px 0 6px;
        color: #4b5563;
        font-size: 12px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
      }
      .password-wrap { position: relative; }
      .password-wrap input { padding-right: 48px; }
      .password-toggle { position: absolute; right: 8px; top: 50%; width: 32px; margin: 0; padding: 4px; transform: translateY(-50%); background: transparent; color: var(--blue); font-size: 16px; }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        border: 0;
        border-radius: 6px;
        background: var(--yellow);
        color: var(--navy);
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #error {
        min-height: 20px;
        margin-top: 14px;
        color: #b91c1c;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>Новый пароль</h1>
      <p>Для продолжения задайте новый пароль длиной от 8 латинских символов, цифр или знаков.</p>
      <form id="password-form">
        <label for="password">Новый пароль</label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="new-password" minlength="8" pattern="[!-~]+" required autofocus oninput="this.value = this.value.replace(/[^\x21-\x7E]/g, '')" />
          <button class="password-toggle" type="button" onclick="togglePassword('password', this)" aria-label="Показать пароль">◉</button>
        </div>
        <label for="confirm">Повторите пароль</label>
        <div class="password-wrap">
          <input id="confirm" type="password" autocomplete="new-password" minlength="8" pattern="[!-~]+" required oninput="this.value = this.value.replace(/[^\x21-\x7E]/g, '')" />
          <button class="password-toggle" type="button" onclick="togglePassword('confirm', this)" aria-label="Показать пароль">◉</button>
        </div>
        <button type="submit">Сохранить пароль</button>
        <div id="error" role="alert"></div>
      </form>
    </main>
    <script>
      document
        .getElementById('password-form')
        .addEventListener('submit', async (event) => {
          event.preventDefault()
          const form = event.currentTarget
          const error = document.getElementById('error')
          const button = form.querySelector('button[type="submit"]')
          if (!/^[\x21-\x7e]{8,}$/.test(form.password.value)) {
            error.textContent = 'Пароль: минимум 8 латинских символов, цифр или знаков'
            return
          }
          if (form.password.value !== form.confirm.value) {
            error.textContent = 'Пароли не совпадают'
            return
          }
          button.disabled = true
          error.textContent = ''
          try {
            const response = await fetch('/api/change-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: form.password.value }),
            })
            const data = await response.json()
            if (!response.ok)
              throw new Error(data.error || 'Не удалось сменить пароль')
            location.href = '/dashboard'
          } catch (err) {
            error.textContent = err.message
            button.disabled = false
          }
        })
      function togglePassword(id, button) {
        const input = document.getElementById(id)
        input.type = input.type === 'password' ? 'text' : 'password'
        button.textContent = input.type === 'password' ? '◉' : '○'
        button.setAttribute('aria-label', input.type === 'password' ? 'Показать пароль' : 'Скрыть пароль')
      }
    </script>
  </body>
</html>
