<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Восстановление пароля — D8N AI</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --navy: #0d1f4e;
        --blue: #2056b8;
        --yellow: #f5c518;
        --bg: #f3f6fb;
        --border: #e5e7eb;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: var(--bg);
        color: var(--navy);
        font:
          14px/1.5 Inter,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      .box {
        width: min(100%, 390px);
        padding: 32px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 16px 45px rgba(13, 31, 78, 0.08);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: #6b7280;
      }
      label {
        display: block;
        margin: 14px 0 6px;
        color: #4b5563;
        font-size: 12px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
      }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        border: 0;
        border-radius: 6px;
        background: var(--yellow);
        color: var(--navy);
        font: 700 13px inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .back {
        display: block;
        margin-top: 14px;
        color: var(--blue);
        text-align: center;
        font-size: 12px;
      }
      #message {
        min-height: 20px;
        margin-top: 14px;
        color: #166534;
        font-size: 12px;
      }
      #message.error {
        color: #b91c1c;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>D8N AI</h1>
      <p id="subtitle">Восстановление доступа к дашборду</p>
      <form id="request-form">
        <label for="email">Почта</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          autofocus
        />
        <button type="submit">Отправить ссылку</button>
      </form>
      <form id="reset-form" class="hidden">
        <label for="password">Новый пароль</label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        />
        <button type="submit">Сохранить пароль</button>
      </form>
      <div id="message" role="alert"></div>
      <a class="back" href="/login.html">Вернуться ко входу</a>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get('token') || ''
      const requestForm = document.getElementById('request-form')
      const resetForm = document.getElementById('reset-form')
      const message = document.getElementById('message')
      if (token) {
        requestForm.classList.add('hidden')
        resetForm.classList.remove('hidden')
        document.getElementById('subtitle').textContent =
          'Создайте новый пароль'
      }
      async function submitForm(form, url, body, success) {
        const button = form.querySelector('button')
        button.disabled = true
        message.textContent = ''
        message.classList.remove('error')
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          })
          const data = await response.json()
          if (!response.ok)
            throw new Error(data.error || 'Операция не выполнена')
          success(data)
        } catch (error) {
          message.textContent = error.message
          message.classList.add('error')
          button.disabled = false
        }
      }
      requestForm.addEventListener('submit', (event) => {
        event.preventDefault()
        submitForm(
          requestForm,
          '/api/forgot-password',
          { email: requestForm.email.value },
          (data) => {
            message.textContent = data.message
            requestForm.reset()
            requestForm.querySelector('button').disabled = false
          }
        )
      })
      resetForm.addEventListener('submit', (event) => {
        event.preventDefault()
        submitForm(
          resetForm,
          '/api/reset-password',
          { token, password: resetForm.password.value },
          () => {
            location.href = '/dashboard'
          }
        )
      })
    </script>
  </body>
</html>
