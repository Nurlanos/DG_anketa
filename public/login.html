<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — D8N AI</title>
  <style>
    * { box-sizing: border-box; }
    :root { --navy: #0d1f4e; --blue: #2056b8; --yellow: #f5c518; --bg: #f3f6fb; --border: #e5e7eb; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; background: var(--bg); color: var(--navy); font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, sans-serif; }
    .box { width: min(100%, 390px); padding: 32px; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 16px 45px rgba(13,31,78,.08); }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 24px; color: #6b7280; }
    label { display: block; margin: 14px 0 6px; color: #4b5563; font-size: 12px; font-weight: 600; }
    input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 6px; font: inherit; }
    input:focus { outline: 2px solid rgba(32,86,184,.2); border-color: var(--blue); }
    button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 6px; background: var(--yellow); color: var(--navy); font: 700 13px inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #error { min-height: 20px; margin-top: 14px; color: #b91c1c; font-size: 12px; }
  </style>
</head>
<body>
  <main class="box">
    <h1>D8N AI</h1>
    <p>Вход в дашборд менеджера</p>
    <form id="login-form">
      <label for="email">Почта</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
      <div id="error" role="alert"></div>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value, password: form.password.value }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Не удалось войти');
        location.href = '/dashboard';
      } catch (err) {
        error.textContent = err.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
